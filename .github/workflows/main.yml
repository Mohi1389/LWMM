name: Build LWMM Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  build-apk:

    runs-on: ubuntu-latest

    steps:

    # دریافت سورس
    - name: Checkout repository
      uses: actions/checkout@v4


    # نصب Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24


    # نصب پکیج‌ها
    - name: Install dependencies
      run: npm install


    # Build پروژه React
    - name: Build React App
      run: npm run build


    # نصب Java 21
    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21


    # بررسی نسخه Java
    - name: Check Java version
      run: java -version


    # نصب Capacitor
    - name: Install Capacitor
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android


    # ساخت Android اگر وجود ندارد
    - name: Add Android Platform
      run: |
        if [ ! -d "android" ]; then
          npx cap add android
        fi


    # Sync Capacitor
    - name: Capacitor Sync
      run: |
        npx cap sync android


    # ساخت APK
    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug


    # آپلود APK
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: LWMM-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
