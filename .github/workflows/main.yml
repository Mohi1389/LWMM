name: Build LWMM Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  build-apk:

    runs-on: ubuntu-latest

    steps:

    # دریافت سورس
    - name: Checkout repository
      uses: actions/checkout@v4


    # نصب Node
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24


    # نصب پکیج ها
    - name: Install dependencies
      run: npm install


    # ساخت نسخه وب React
    - name: Build React App
      run: npm run build


    # نصب Java برای Android
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17


    # نصب Capacitor اگر در package نیست
    - name: Install Capacitor
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android


    # انتقال تغییرات به Android
    - name: Capacitor Sync
      run: |
        npx cap sync android


    # ساخت APK
    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug


    # آماده کردن فایل APK برای دانلود
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: LWMM-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
